<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KU Leuven MechEng — Course Planner</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="titleblock">
  <div class="tb-cell">
    <div class="k">Programme</div>
    <div class="v">Master of Mechanical Eng.</div>
  </div>
  <div class="tb-cell">
    <div class="k">Module</div>
    <div class="v"><select id="moduleSelect"><option value="">— none selected —</option></select></div>
  </div>
  <div class="tb-cell">
    <div class="k">Core</div>
    <div class="v tnum" id="coreStat">0/28</div>
  </div>
  <div class="tb-cell">
    <div class="k">Module</div>
    <div class="v tnum" id="modStat">0/—</div>
  </div>
  <div class="tb-cell">
    <div class="k">Total ECTS</div>
    <div class="v big tnum" id="totalStat">0/120</div>
  </div>
</div>

<div class="sectionnav">
  <button class="section-tab active" data-section="select">Select your courses</button>
  <span class="sn-arrow">&rsaquo;</span>
  <button class="section-tab" data-section="overview">2-year overview</button>
  <span class="sn-arrow">&rsaquo;</span>
  <button class="section-tab" data-section="planner">Weekly planner <span id="plannerConflictBadge"></span></button>
</div>

<main class="body">

  <section class="section-select" id="sectionSelect">
    <div class="select-controls">
      <input id="searchBox" type="search" placeholder="Search courses…" autocomplete="off">
      <select id="filterSelect"><option value="">All categories &amp; modules</option></select>
    </div>
    <div class="req-strip" id="reqStrip"></div>
    <div class="course-groups" id="courseGroups"></div>
  </section>

  <section class="section-overview" id="sectionOverview" hidden>
    <div class="overview-grid" id="overviewGrid"></div>
  </section>

  <section class="section-planner" id="sectionPlanner" hidden>
    <div class="weeknav">
      <button id="weekPrev" class="wn-btn" aria-label="Previous week">&larr;</button>
      <button id="weekToday" class="wn-btn wn-today">Today</button>
      <button id="weekNext" class="wn-btn" aria-label="Next week">&rarr;</button>
      <div class="wn-range" id="weekRange">—</div>
      <span class="wn-badge sem" id="semBadge">Semester —</span>
      <span class="wn-badge stage" id="stageBadge">Stage 1</span>
      <div class="wn-conflict-flag" id="conflictFlag" hidden></div>
    </div>
    <div class="planner-body">
      <div class="calendar" id="calendarWrap">
        <div class="cal-hours" id="calHours"></div>
        <div class="cal-days" id="calDays"></div>
      </div>
      <aside class="planner-side">
        <div class="side-tabs">
          <button class="side-tab active" data-tab="conflicts">Conflicts <span id="conflictCount"></span></button>
          <button class="side-tab" data-tab="stage2">Stage 2</button>
        </div>
        <div class="side-panel" id="panelConflicts">
          <div class="conflict-list" id="conflictList"></div>
        </div>
        <div class="side-panel" id="panelStage2" hidden>
          <div class="stage2-list" id="stage2List"></div>
        </div>
      </aside>
    </div>
  </section>

</main>

<div class="scrim" id="scrim"></div>
<div class="slideover" id="slideover">
  <button class="close" id="closeSlide" aria-label="Close">&times;</button>
  <div id="slideContent"></div>
</div>

<footer class="statusbar" id="statusbar"></footer>

<script src="app.js"></script>
</body>
</html>
